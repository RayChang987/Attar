[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "attar"
version = "0.1.0"
description = "The fast loop for physical design: any benchmark as GPU tensors, place and evaluate in seconds, validate in ORFS"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = ["torch>=2.0", "numpy", "scipy", "matplotlib", "huggingface_hub>=0.20", "zstandard"]

[project.optional-dependencies]
docs = ["pillow", "pygments"]

[tool.setuptools.packages.find]
include = ["attar*"]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E9", "F", "B"]
# B023: every closure over a loop variable here is called within the same iteration
ignore = ["B023"]

[tool.ruff.lint.per-file-ignores]
# names used inside timeit / exec strings
"tools/bench_*.py" = ["F821"]
"tools/make_demo_gif.py" = ["F821"]
