[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "attar"
dynamic = ["version"]
description = "The fast loop for VLSI physical design: GPU-accelerated placement, floorplanning, static timing analysis and global routing in PyTorch, on 262 ISPD, ICCAD and OpenROAD benchmarks"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "RayChang987"}]
keywords = ["eda", "electronic design automation", "vlsi", "physical design", "chip design", "placement",
            "global placement", "legalization", "detailed placement", "floorplanning", "macro placement",
            "static timing analysis", "global routing", "clock tree synthesis", "openroad", "ispd", "iccad",
            "benchmark", "pytorch", "gpu", "cuda"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = ["torch>=2.0", "numpy", "scipy", "matplotlib", "huggingface_hub>=0.20", "zstandard"]

[project.optional-dependencies]
docs = ["pillow", "pygments"]
dev = ["ruff", "build", "twine"]

[project.urls]
Homepage = "https://github.com/RayChang987/Attar"
Source = "https://github.com/RayChang987/Attar"
Documentation = "https://github.com/RayChang987/Attar/tree/main/docs"
Changelog = "https://github.com/RayChang987/Attar/blob/main/CHANGELOG.md"
Dataset = "https://huggingface.co/datasets/RayChang987/attar-zoo"
Issues = "https://github.com/RayChang987/Attar/issues"

[tool.setuptools.dynamic]
version = {attr = "attar.__version__"}

[tool.setuptools.packages.find]
include = ["attar*"]

[tool.setuptools.package-data]
"attar.timing" = ["csrc/*.cpp", "csrc/*.h"]
"attar.naive" = ["csrc/*.cpp"]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E9", "F", "B"]
# B023: every closure over a loop variable here is called within the same iteration
ignore = ["B023"]

[tool.ruff.lint.per-file-ignores]
# names used inside timeit / exec strings
"tools/bench_*.py" = ["F821"]
"tools/make_demo_gif.py" = ["F821"]
